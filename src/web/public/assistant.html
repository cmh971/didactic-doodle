<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo · Local Assistant · Sentinel</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--text); display:flex; flex-direction:column;
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background: radial-gradient(900px 500px at 85% -10%, rgba(46,204,113,.10), transparent 60%), var(--bg); }
    .top { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); background:rgba(0,0,0,.2); }
    .orb { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#2dd4bf,#5865f2); display:grid; place-items:center; font-size:1.2rem;
      box-shadow:0 0 0 0 rgba(45,212,191,.5); animation:pulse 2.4s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(45,212,191,.5);} 70%{box-shadow:0 0 0 12px rgba(45,212,191,0);} 100%{box-shadow:0 0 0 0 rgba(45,212,191,0);} }
    .top h1 { font-size:1.1rem; margin:0; font-weight:800; }
    .top .badge { font-size:.66rem; color:#5eead4; border:1px solid rgba(45,212,191,.4); border-radius:999px; padding:2px 8px; font-weight:800; letter-spacing:.05em; }
    .top .sub { color:var(--muted); font-size:.75rem; margin-left:auto; }

    .chat { flex:1; overflow-y:auto; padding:22px; max-width:820px; width:100%; margin:0 auto; }
    .row { display:flex; gap:10px; margin-bottom:14px; align-items:flex-end; }
    .row.me { flex-direction:row-reverse; }
    .av { width:30px; height:30px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; font-size:.9rem; }
    .av.echo { background:linear-gradient(135deg,#2dd4bf,#5865f2); }
    .av.me { background:#3a2c14; }
    .bubble { max-width:78%; padding:11px 15px; border-radius:16px; line-height:1.5; font-size:.94rem; white-space:pre-wrap; word-wrap:break-word; }
    .echo .bubble { background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:5px; }
    .me .bubble { background:linear-gradient(135deg,var(--accent),#4b5bd9); color:#fff; border-bottom-right-radius:5px; }
    .bubble b { font-weight:800; }
    .scan { font-size:.68rem; color:var(--muted); margin-top:6px; font-family:'Cascadia Code',monospace; }
    .scan span { background:rgba(45,212,191,.12); border-radius:5px; padding:1px 5px; margin-right:4px; }
    .typing span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin:0 1px; animation:blink 1.2s infinite; }
    .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
    @keyframes blink { 0%,60%,100%{ opacity:.3; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-3px);} }

    .suggest { max-width:820px; margin:0 auto; padding:0 22px 8px; display:flex; gap:8px; flex-wrap:wrap; }
    .suggest button { background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:.8rem; cursor:pointer; }
    .suggest button:hover { border-color:var(--accent); color:var(--text); }

    .composer { border-top:1px solid var(--border); padding:14px 22px; background:rgba(0,0,0,.2); }
    .composer .box { max-width:820px; margin:0 auto; display:flex; gap:10px; }
    .composer input { flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px 15px; font-size:.95rem; }
    .composer input:focus { outline:none; border-color:var(--accent); }
    .composer button { background:linear-gradient(135deg,#2dd4bf,#5865f2); color:#fff; border:0; border-radius:12px; padding:0 20px; font-weight:800; cursor:pointer; }
    .foot { text-align:center; color:var(--muted); font-size:.72rem; padding:8px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="orb">🧠</div>
    <h1>Echo <span class="badge">LOCAL · NO CLOUD</span></h1>
    <div class="sub">Runs 100% in your browser — no Gemini, no API</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="suggest" id="suggest">
    <button>Hello</button>
    <button>What can the bot do?</button>
    <button>How do I set up the economy?</button>
    <button>How many commands?</button>
    <button>Tell me a joke</button>
  </div>

  <div class="composer">
    <div class="box">
      <input id="input" type="text" placeholder="Say something to Echo…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>
  <div class="foot">Echo scans your message, detects intent, and replies — all offline. 🔒</div>

  <script src="/assistant.js"></script>
  <script>
  (() => {
    const chat = document.getElementById('chat'), input = document.getElementById('input');
    const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
    const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };

    function addUser(text) {
      chat.insertAdjacentHTML('beforeend', `<div class="row me"><div class="av me">🧑</div><div class="bubble">${md(text)}</div></div>`);
      scrollDown();
    }
    function addTyping() {
      const id = 't' + Date.now();
      chat.insertAdjacentHTML('beforeend', `<div class="row echo" id="${id}"><div class="av echo">🧠</div><div class="bubble typing"><span></span><span></span><span></span></div></div>`);
      scrollDown(); return id;
    }
    function addEcho(text, scan) {
      const scanHtml = (scan && scan.length) ? `<div class="scan">🔍 scanned: ${scan.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : '';
      chat.insertAdjacentHTML('beforeend', `<div class="row echo"><div class="av echo">🧠</div><div><div class="bubble">${md(text)}</div>${scanHtml}</div></div>`);
      scrollDown();
    }

    function ask(text) {
      if (!text.trim()) return;
      addUser(text);
      const tid = addTyping();
      // "scan then respond" — a short, deliberate think delay so it feels alive.
      setTimeout(() => {
        const { text: reply, scan } = window.Echo.respond(text);
        document.getElementById(tid)?.remove();
        addEcho(reply, scan);
      }, 420 + Math.min(900, text.length * 12));
    }

    document.getElementById('send').onclick = () => { ask(input.value); input.value = ''; input.focus(); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { ask(input.value); input.value = ''; } });
    document.getElementById('suggest').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') ask(e.target.textContent); });

    // greeting on load
    setTimeout(() => addEcho("Hi! I'm **Echo**, Sentinel's local assistant. 👋 I run entirely in your browser — no Gemini, no cloud. Ask me how to set things up, what the bot can do, or just chat. Try a suggestion below! 🧭", []), 400);
    input.focus();
  })();
  </script>
</body>
</html>
