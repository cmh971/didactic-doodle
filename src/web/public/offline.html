<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Sentinel</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root {
      --bg: #05070d; --accent: #5865f2; --accent-soft: #8893ff;
      --warn: #f59e0b; --text: #e6edf3; --muted: #9aa7b4;
      --panel: #111827; --border: #1f2937; --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
      background:
        radial-gradient(circle at 12% -10%, rgba(88,101,242,0.30), transparent 55%),
        radial-gradient(circle at 88% 110%, rgba(245,158,11,0.28), transparent 55%),
        linear-gradient(135deg, #020617, #05070d);
      display: flex; align-items: center; justify-content: center;
    }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .orb { position: absolute; border-radius: 50%; filter: blur(42px); opacity: .65; mix-blend-mode: screen; animation: floatOrb 20s infinite ease-in-out; }
    .orb-1 { width: 260px; height: 260px; top: -40px; left: 8%; background: radial-gradient(circle, rgba(88,101,242,.6), transparent 70%); }
    .orb-2 { width: 320px; height: 320px; bottom: -80px; right: 6%; background: radial-gradient(circle, rgba(245,158,11,.5), transparent 70%); animation-delay: -5s; }
    @keyframes floatOrb { 0%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-28px,-38px) scale(1.14);} 100%{ transform: translate(0,0) scale(1);} }

    .card { position: relative; z-index: 2; max-width: 560px; margin: 40px 16px; padding: 40px 30px 30px;
      border-radius: var(--radius); text-align: center; background: radial-gradient(circle at top, rgba(88,101,242,.15), transparent 55%), var(--panel);
      border: 1px solid rgba(148,163,184,.32); box-shadow: 0 24px 80px rgba(15,23,42,.9); }

    .hero-img { display: block; width: 100%; max-width: 220px; height: auto; margin: 0 auto 6px;
      filter: drop-shadow(0 12px 30px rgba(88,101,242,0.45)); animation: bob 5s infinite ease-in-out; }
    @keyframes bob { 0%,100%{ transform: translateY(0) rotate(-3deg);} 50%{ transform: translateY(-12px) rotate(3deg);} }

    /* animated "signal lost" bars */
    .bars { display: inline-flex; align-items: flex-end; gap: 5px; height: 30px; margin: 6px 0 14px; }
    .bars i { width: 8px; border-radius: 3px; background: var(--muted); opacity: .35; animation: pulseBar 1.4s infinite ease-in-out; }
    .bars i:nth-child(1){ height: 10px; } .bars i:nth-child(2){ height: 17px; animation-delay: .15s; }
    .bars i:nth-child(3){ height: 24px; animation-delay: .3s; } .bars i:nth-child(4){ height: 30px; animation-delay: .45s; }
    @keyframes pulseBar { 0%,100%{ opacity: .3; } 50%{ opacity: .9; background: var(--warn); } }

    h1 { margin: 0; font-size: 2rem; font-weight: 850; }
    .muted { margin: 12px 0 24px; color: var(--muted); line-height: 1.7; font-size: .98rem; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700;
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); margin-bottom: 22px; }
    .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .status.online { color: #4ade80; border-color: rgba(74,222,128,.4); }
    .status.online .dot { background: #22c55e; animation: none; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 24px; border-radius: 999px;
      border: 1px solid var(--border); font-size: .98rem; font-weight: 700; text-decoration: none; color: var(--text); cursor: pointer;
      background: transparent; transition: transform .18s, box-shadow .18s, filter .18s; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-soft)); color: #fff; border-color: transparent; box-shadow: 0 12px 30px rgba(88,101,242,.5); }
    .btn:hover { transform: translateY(-2px); } .btn.primary:hover { filter: brightness(1.06); }
    .tip { margin-top: 20px; font-size: .82rem; color: var(--muted); }
    .tip a { color: var(--accent-soft); text-decoration: none; }
    @media (prefers-reduced-motion: reduce){ .orb, .hero-img, .bars i, .status .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span></div>

  <main class="card">
    <img class="hero-img" src="/offline.png" alt="Offline" />
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>You're offline</h1>
    <p class="muted">
      Sentinel can't reach the network right now.<br>
      Check your Wi-Fi or data — we'll reconnect you the moment you're back.
    </p>

    <div class="status" id="status"><span class="dot"></span><span id="statusText">Waiting for connection…</span></div>

    <div class="actions">
      <button class="btn primary" onclick="location.reload()">🔄 Try again</button>
      <a class="btn" href="/dashboard">Open cached dashboard</a>
    </div>

    <p class="tip">🎧 Any tracks you saved with <b>Save offline</b> still play — head to <a href="/audio-app">the audio player</a>.</p>
  </main>

  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');

      var box = document.getElementById('status'), txt = document.getElementById('statusText');
      function refresh() {
        if (navigator.onLine) {
          box.classList.add('online'); txt.textContent = 'Back online — reloading…';
          setTimeout(function () { location.reload(); }, 900);
        } else {
          box.classList.remove('online'); txt.textContent = 'Waiting for connection…';
        }
      }
      window.addEventListener('online', refresh);
      window.addEventListener('offline', refresh);
      // Also actively probe every few seconds in case the 'online' event is missed.
      setInterval(function () {
        if (!navigator.onLine) return;
        fetch('/favicon.ico', { method: 'HEAD', cache: 'no-store' }).then(refresh).catch(function () {});
      }, 4000);
      refresh();
    })();
  </script>
</body>
</html>
