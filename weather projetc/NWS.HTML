<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8" />
<title>NWS Alerts Command Center</title>
<style>
    :root {
        --radius-squircle: 22px;
        --transition-fast: 0.25s ease-out;

        /* Light */
        --bg-light: #f4f5f7;
        --panel-light: #ffffff;
        --text-main-light: #111827;
        --text-sub-light: #6b7280;

        /* Dark */
        --bg-dark: #050816;
        --panel-dark: #0b1020;
        --text-main-dark: #f9fafb;
        --text-sub-dark: #9ca3af;

        /* Severity Colors */
        --sev-green: #16a34a;
        --sev-yellow: #f59e0b;
        --sev-orange: #ea580c;
        --sev-red: #dc2626;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, "SF Pro Text", sans-serif;
        background: var(--bg-light);
        color: var(--text-main-light);
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    body.dark {
        background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
        color: var(--text-main-dark);
    }

    .shell {
        width: 100%;
        max-width: 900px;
        padding: 24px 16px 40px;
    }

    .header {
        margin-bottom: 20px;
    }

    .header-title {
        font-size: 26px;
        font-weight: 650;
        margin-bottom: 4px;
    }

    .header-sub {
        font-size: 13px;
        color: var(--text-sub-light);
    }

    body.dark .header-sub {
        color: var(--text-sub-dark);
    }

    .alert-card {
        border-radius: var(--radius-squircle);
        padding: 18px 20px;
        margin-bottom: 18px;
        background: var(--panel-light);
        box-shadow: 0 18px 40px rgba(0,0,0,0.08);
        transition: transform var(--transition-fast);
    }

    body.dark .alert-card {
        background: radial-gradient(circle at top left, #111827 0, #020617 55%, #000 100%);
        box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    }

    .alert-card:hover {
        transform: translateY(-2px);
    }

    .alert-title {
        font-size: 20px;
        font-weight: 650;
        margin-bottom: 6px;
    }

    .alert-meta {
        font-size: 12px;
        margin-bottom: 10px;
        color: var(--text-sub-light);
    }

    body.dark .alert-meta {
        color: var(--text-sub-dark);
    }

    .alert-headline {
        font-size: 14px;
        margin-bottom: 10px;
    }

    .alert-desc {
        font-size: 13px;
        margin-bottom: 10px;
        line-height: 1.45;
    }

    .alert-instr {
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
    }

    .sev-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 10px;
        color: white;
    }

    .sev-green { background: var(--sev-green); }
    .sev-yellow { background: var(--sev-yellow); }
    .sev-orange { background: var(--sev-orange); }
    .sev-red { background: var(--sev-red); }

    .no-alerts {
        text-align: center;
        padding: 40px 20px;
        font-size: 16px;
        opacity: 0.7;
    }

    .theme-toggle {
        margin-top: 10px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(148,163,184,0.4);
        background: rgba(255,255,255,0.8);
        cursor: pointer;
        font-size: 12px;
        backdrop-filter: blur(10px);
    }

    body.dark .theme-toggle {
        background: rgba(15,23,42,0.8);
        border-color: rgba(55,65,81,0.8);
        color: var(--text-sub-dark);
    }
</style>
</head>

<body>
<div class="shell">
    <div class="header">
        <div class="header-title">NWS Alerts Command Center</div>
        <div class="header-sub" id="header-sub">Initializing alert feed…</div>
        <button class="theme-toggle" id="theme-toggle">Toggle Theme</button>
    </div>

    <div id="alerts-container"></div>
</div>

<script>
const LAT = 38.9822;
const LON = -94.6708;

const USER_AGENT = "customs-bt (christian.reavis1@gmail.com)";

const container = document.getElementById("alerts-container");
const headerSub = document.getElementById("header-sub");
const themeToggle = document.getElementById("theme-toggle");

themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
});

function severityClass(sev) {
    if (!sev) return "sev-yellow";
    sev = sev.toLowerCase();
    if (sev.includes("minor")) return "sev-green";
    if (sev.includes("moderate")) return "sev-yellow";
    if (sev.includes("severe")) return "sev-orange";
    if (sev.includes("extreme")) return "sev-red";
    return "sev-yellow";
}

async function loadAlerts() {
    try {
        headerSub.textContent = "Contacting National Weather Service…";

        const res = await fetch(
            `https://api.weather.gov/alerts/active?point=${LAT},${LON}`,
            {
                headers: {
                    "User-Agent": USER_AGENT,
                    "Accept": "application/geo+json"
                }
            }
        );

        const data = await res.json();

        container.innerHTML = "";

        if (!data.features || data.features.length === 0) {
            container.innerHTML = `<div class="no-alerts">No active alerts for your area.</div>`;
            headerSub.textContent = "No active alerts.";
            return;
        }

        headerSub.textContent = `${data.features.length} active alert(s)`;

        data.features.forEach(alert => {
            const p = alert.properties;

            const sevClass = severityClass(p.severity);

            const card = document.createElement("div");
            card.className = "alert-card";

            card.innerHTML = `
                <div class="sev-badge ${sevClass}">${p.severity || "Alert"}</div>
                <div class="alert-title">${p.event || "Weather Alert"}</div>
                <div class="alert-meta">
                    Urgency: <strong>${p.urgency || "Unknown"}</strong> · 
                    Certainty: <strong>${p.certainty || "Unknown"}</strong>
                </div>
                <div class="alert-headline">${p.headline || ""}</div>
                <div class="alert-desc">${p.description || "No description provided."}</div>
                <div class="alert-instr">${p.instruction || ""}</div>
            `;

            container.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="no-alerts">Error loading NWS alerts.</div>`;
        headerSub.textContent = "Error loading alerts.";
    }
}

loadAlerts();
setInterval(loadAlerts, 5 * 60 * 1000);
</script>

</body>
</html>
