<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convective Threat Interface & Weather Station</title>
  <!--
    Rebuilt to run on the Sentinel server. No more Firebase, no Apps Script proxy,
    and NO API keys in this page:
      • Sign-in uses the bot's own Google OAuth (/auth/google) — session-based.
      • The AI chat calls /api/radar-ai, which runs Gemini SERVER-SIDE (key hidden).
      • The radar is a keyless Windy embed.
  -->
  <style>
    :root { --neon: #3b82f6; --p2: #ff0055; --bg: #050505; --border-color: #333; }
    body {
      background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px;
      display: flex; flex-direction: column; gap: 15px; height: 100vh; box-sizing: border-box;
      background-image: linear-gradient(rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.2) 50%); background-size: 100% 4px; overflow: hidden;
    }
    #master-jail { position: fixed; inset: 0; background: #000; z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .auth-card { border: 3px solid var(--neon); padding: 40px; background: #111; text-align: center; box-shadow: 0 0 40px var(--neon); width: 340px; border-radius: 20px; }
    .btn { border: none; padding: 13px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.1s, opacity 0.2s, filter 0.2s; margin-top: 10px; }
    .btn:active { transform: scale(0.98); }
    .btn:hover { filter: brightness(1.1); }
    .google-btn { background: #fff; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .discord-btn { background: #5865f2; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
    #top-nav { display: none; width: 100%; padding: 12px 20px; background: #0a0a0a; border: 1px solid var(--border-color); border-radius: 12px; justify-content: space-between; align-items: center; box-sizing: border-box; }
    #user-id { font-size: 12px; color: var(--neon); font-weight: bold; font-family: monospace; }
    #main-application { display: none; flex-direction: column; gap: 15px; flex: 1; overflow: hidden; }
    #radar-container { width: 100%; height: 400px; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(59,130,246,0.15); }
    iframe { width: 100%; height: 100%; border: none; }
    .radar-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 4px; font-size: 13px; border-left: 4px solid var(--neon); font-weight: bold; letter-spacing: 1px; z-index: 10; pointer-events: none; }
    #chat-container { flex: 1; border: 1px solid var(--border-color); border-radius: 12px; background: #000; display: flex; flex-direction: column; overflow: hidden; }
    #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .helper-msg { align-self: flex-start; background: #111; color: var(--neon); padding: 12px; border-radius: 2px 12px 12px 12px; border-left: 3px solid var(--neon); font-size: 14px; line-height: 1.5; max-width: 85%; border-top: 1px solid #222; }
    .user-msg { align-self: flex-end; background: var(--neon); color: #000; padding: 10px 15px; border-radius: 12px 12px 2px 12px; font-weight: 700; font-size: 14px; max-width: 80%; animation: popIn 0.2s ease-out; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    #input-area { display: flex; padding: 15px; background: #0a0a0a; gap: 10px; border-top: 1px solid #222; }
    #userInput { flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 6px; outline: none; }
    #userInput:focus { border-color: var(--neon); }
    #sendBtn { width: auto; padding: 12px 20px; background: var(--neon); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .typing { color: #555; font-size: 12px; padding-left: 20px; display: none; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="master-jail">
    <div class="auth-card">
      <h1 style="color:var(--neon); margin:0 0 5px 0; font-size:24px; letter-spacing:1px;">WEATHER RADAR</h1>
      <p style="color:#888; font-size:12px; margin:0 0 22px 0;">IDENTITY REQUIRED — SIGN IN TO ACCESS</p>
      <button class="btn google-btn" onclick="location.href='/auth/google?next=/radar-panel'">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="width:16px;" alt="G"> Sign in with Google
      </button>
      <p id="err" style="color:var(--p2); font-size:11px; margin-top:15px; font-weight:bold;"></p>
    </div>
  </div>

  <div id="top-nav">
    <div style="display:flex; align-items:center; gap:10px;">
      <img id="user-pfp" src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png" style="width:30px; height:30px; border-radius:50%; border:1px solid var(--neon);">
      <span id="user-id">OPERATOR_PENDING</span>
    </div>
    <button class="btn" onclick="location.href='/logout'" style="background:var(--p2); color:#fff; width:auto; padding:6px 15px; font-size:12px; margin:0;">LOGOUT</button>
  </div>

  <div id="main-application">
    <div id="radar-container">
      <div class="radar-overlay">WEATHER RADAR | LOC: OVERLAND PARK</div>
      <iframe src="https://embed.windy.com/embed2.html?lat=38.982&lon=-94.671&zoom=10&overlay=radar" allowfullscreen></iframe>
    </div>

    <div id="chat-container">
      <div id="chat-window">
        <div class="helper-msg"><b>[WEATHER-AI]:</b> Station online. Ask me anything about the weather — forecasts, what to wear, storm risk, you name it. ⛅</div>
      </div>
      <div id="typing" class="typing">AI IS ANALYZING LOTS... AND LOTS... OF DATA...</div>
      <div id="input-area">
        <input type="text" id="userInput" placeholder="Enter tactical weather request…">
        <button id="sendBtn" onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>

  <script>
    // ---- Auth via the bot's own session (Discord OR Google) ----
    async function checkAuth() {
      try {
        const me = await fetch('/api/radar/me').then((r) => r.json());
        if (me.authed) showApp(me);
        else showLogin();
      } catch { showLogin(); }
    }
    function showApp(me) {
      document.getElementById('master-jail').style.display = 'none';
      document.getElementById('top-nav').style.display = 'flex';
      document.getElementById('main-application').style.display = 'flex';
      document.getElementById('user-id').innerText = 'OPERATOR: ' + String(me.name || 'UNKNOWN').toUpperCase();
      if (me.avatar) document.getElementById('user-pfp').src = me.avatar;
    }
    function showLogin() {
      document.getElementById('master-jail').style.display = 'flex';
      document.getElementById('top-nav').style.display = 'none';
      document.getElementById('main-application').style.display = 'none';
    }

    // ---- AI chat → server-side Gemini (key stays hidden) ----
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatWindow = document.getElementById('chat-window');
      const typing = document.getElementById('typing');
      const userText = input.value.trim();
      if (!userText) return;
      const um = document.createElement('div');
      um.className = 'user-msg';
      um.textContent = userText; // textContent = XSS-safe
      chatWindow.appendChild(um);
      input.value = '';
      typing.style.display = 'block';
      chatWindow.scrollTop = chatWindow.scrollHeight;
      try {
        const resp = await fetch('/api/radar-ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: userText }) });
        const data = await resp.json();
        const msg = document.createElement('div');
        msg.className = 'helper-msg';
        msg.innerHTML = '<b>[WEATHER-AI]:</b> ';
        msg.appendChild(document.createTextNode(data.text || 'No response.'));
        chatWindow.appendChild(msg);
      } catch (e) {
        const err = document.createElement('div');
        err.className = 'helper-msg';
        err.style.cssText = 'color:#ff4444; border-left-color:#ff4444;';
        err.innerHTML = '<b>[SYSTEM ERROR]:</b> Connection vector failed to respond.';
        chatWindow.appendChild(err);
      } finally {
        typing.style.display = 'none';
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    }
    document.getElementById('userInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') sendMessage(); });
    checkAuth();
  </script>
  <script src="/projnav.js" defer></script>
</body>
</html>
