<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .skyfire-header { 
            background: linear-gradient(90deg, #1e1b4b 0%, #000 100%);
            border-left: 4px solid #f59e0b; 
            padding: 10px 15px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        #lightning-map { 
            width: 100%; 
            height: 500px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.1);
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="skyfire-header">
    <span>SYSTEM: isONpan>
    <span style="color: #f59e0b;">LIVE LIGHTNING MAP</span>
</div>

<div id="lightning-map">
    <!-- Blitzortung lightning tracker centered on Overland Park coordinates -->
    <iframe src="https://map.blitzortung.org/#10/38.98/-94.67" allowfullscreen></iframe>
</div>

</body>
</html>s
